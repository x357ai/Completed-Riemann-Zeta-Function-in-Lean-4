name = "my_math_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MyMathProject", "SeamCoupling", "XiRectangleBound"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "MyMathProject"

[[lean_lib]]
name = "SeamCoupling"

[[lean_lib]]
name = "XiRectangleBound"
